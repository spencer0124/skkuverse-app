# Keeps the SHA-pinned actions current: one grouped pull request a month for
# every `uses:` in .github/workflows/, each pin rewritten with its new version
# comment. npm is limited to the @skkuverse/* SDK packages, so a release that adds a
# bridge method opens a pull request whose tests name any method the app does not
# handle yet; every other package is bumped one per change by hand. A release is offered only once it is seven days
# old, so a compromised version pulled upstream within days never reaches a
# pull request. scripts/workflow-pins.test.mjs pins this file and the SHA pins
# it maintains.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "@skkuverse/*"
