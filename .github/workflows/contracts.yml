name: Contracts

# The first CI this repo has had. functions/test/*.test.ts existed and had
# never run anywhere but a laptop — including tabsContract.test.ts, which is
# the only thing standing between a backend tab change and silently sending
# zero notifications for that tab.
on:
  pull_request:
    # dev, not just main: dev is the real integration branch here, and gating
    # only main would let drift sit in dev indefinitely.
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      # NOT node-version-file: .nvmrc. The repo root pins 20 for the RN/Expo
      # toolchain, but functions/package.json declares engines.node "22" and
      # `npm test` runs node --experimental-strip-types, which needs 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # functions/ is not a yarn workspace member (root workspaces are apps/*
      # and packages/*) and carries its own package-lock.json, so this is a
      # plain npm ci untouched by the Expo toolchain.
      - run: npm ci

      # tabsContract.ts mirrors skkuverse-server's categories.json. Adding a
      # *fixed* tab without updating the mirror is otherwise undetectable —
      # derive() warns on an unknown picker key, but a missing fixed key just
      # means that tab's subscribers receive nothing, with no error anywhere.
      # Offline: it compares against this repo's own .contracts.lock.json, so
      # it can never go red because someone edited a category upstream.
      - name: Fetch contract tooling
        working-directory: .
        run: git clone --depth 1 https://github.com/spencer0124/skkuverse "$RUNNER_TEMP/sv"
      - name: Contract integrity
        working-directory: .
        run: python3 "$RUNNER_TEMP/sv/tools/skkuverse_sync.py" check --repo app --root .

      - run: npm run build
      - run: npm run lint
      - run: npm test
