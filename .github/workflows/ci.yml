name: CI

# Split into jobs by what a red result means, so the job name carries the
# diagnosis: `conventions` says the fleet's shared rules are violated,
# `workspace` says this repo's own code is, and `prose` says the writing drifted. Conflating them
# makes the failure name useless.
on:
  # A pull request to main or dev runs every job, and a push to main runs them
  # again as the record of what shipped.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Every job only reads the checkout.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress, since only
# the tip's result is ever read. Never cancel on main — a push there is the
# record of what shipped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Offline and dependency-free: ubuntu-latest ships python3 and the linter is
  # stdlib-only, so this job installs nothing.
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHY: no step pushes, so the token is not left in .git/config for the steps that follow.
          persist-credentials: false

      # The full set, with no --only. `language` scans docs/, README.md and
      # CLAUDE.md, and passes because they are English. Korean that is the
      # product keeps a `conventions:allow-korean` marker on its own line,
      # which is the exception this repo declares in place of exempting whole
      # files in .conventions.json.
      #
      # WHY: a byte-identical copy of skkuverse-server's public
      # .github/contract-tools/exported/lint_conventions.py at 4e2c67ad1486cedf2cb085951924f92d5174a08f.
      - name: Conventions
        run: python3 -I scripts/conventions/lint_conventions.py --root .

  # apps/ and packages/ — 316 tests and the whole ESLint + markdownlint surface
  # that had only ever run on a laptop.
  workspace:
    runs-on: ubuntu-latest
    steps:
      # Full history: the suppressions ratchet below compares with the commit
      # the push or the pull request started from, which a shallow clone lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # WHY: no step pushes, so the token is not left in .git/config for the code under check.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Red means a patch in patches/ is not in effect after the install, or is
      # named for a version other than the one the lockfile installs (which
      # patch-package only warns about). The bottom-sheet one is the TestFlight
      # 3.6.2 crash fix.
      - name: Every patch in patches/ is applied
        run: node scripts/check-patches.mjs
      # Red means a library that holds React context or global state (the list
      # lives in the script) is installed twice, so part of the app reads state
      # the rest never sees. On 10/5 a nested @tanstack/react-query beside the
      # hoisted one made every fresh install open on "No QueryClient set".
      - name: One copy of each singleton library
        run: node scripts/check-singletons.mjs
      # Red means a copy of a server fixture under apps/mobile differs from the public server commit
      # server-fixtures.lock.json pins; the log names the fix. Reads raw.githubusercontent.com.
      - name: Server fixtures match the pinned server commit
        run: node scripts/sync-server-fixtures.mjs --check
      - run: yarn typecheck
      - run: yarn lint
      # `yarn lint` runs the ratchet against HEAD, which here is the commit
      # under test, so it can only catch an entry for a deleted file. This
      # compares eslint-suppressions.json with the base instead: every commit
      # of a push, or everything a pull request adds. Red means the record grew
      # (a re-record hid a new violation), which only fixing the code undoes
      # (docs/decisions/0016). A rule ID recorded for the first time passes,
      # since that is how a rule is switched on, so the script lists such IDs in
      # the job summary, and any change to the exceptions registry goes there
      # too: neither should land unread.
      - name: Suppressions record only shrinks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            # A push that created the branch or rewrote history has no usable
            # before; compare with where the branch left main.
            base=$(git merge-base origin/main HEAD)
            echo "::warning::No usable push base ($BEFORE); comparing with the merge base with main, $base."
          fi
          registry=scripts/eslint/sds-exceptions.cjs
          if ! git diff --quiet "$base" -- "$registry"; then
            {
              echo "### \`$registry\` changed"
              echo
              echo '```diff'
              git diff "$base" -- "$registry"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/check-suppressions-ratchet.mjs "$base"
          # The architecture allowlists (scripts/architecture/ratchet.mjs) compare
          # with the same base when `yarn test` runs below.
          echo "ARCH_BASE=$base" >> "$GITHUB_ENV"
      - run: yarn test
      # Red means a .env file in apps/mobile reached a bundle: Expo's dev-only
      # env module sweeps up every .env* file in the project root. Bundles iOS
      # in both modes with canary files, about 3 min.
      - name: No .env file reaches a bundle
        run: node scripts/check-bundle-secrets.mjs

  # The prose rules in .vale.ini and styles/skkuverse/.
  #
  # Every ai-tells rule ships at `level: error`, so this job is a hard gate, not
  # advice. The one advisory rule is our own EmDashDensity, at
  # `level: warning`, which the exit code ignores.
  prose:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.17.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHY: no step pushes, so the token is not left in .git/config for the steps that follow.
          persist-credentials: false

      - name: Install Vale
        run: |
          curl -sfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version

      # docs/ and README.md. CLAUDE.md is left out on purpose: it is dense
      # reference prose whose opening line is boilerplate the rules reject, and
      # making it clean is separate work.
      - name: Prose
        shell: bash
        run: |
          # shell: bash plus pipefail is load-bearing. The implicit shell is
          # `bash -e {0}`, which has errexit but not pipefail, so `vale | tee`
          # would exit with tee's status and this job would pass while printing
          # findings.
          set -o pipefail
          # sync writes the pinned packages into styles/, which .gitignore keeps untracked.
          vale sync --config=.vale.ini
          vale --config=.vale.ini --glob='!node_modules/**' docs/ README.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
