name: Claude Code

on:
  # WHY: the token sits in the `claude` environment, which admits only `main`, where an issue comment runs; a review
  # or review comment runs on the merge ref, which it refuses. zizmor flags issue_comment: the jobs start only for
  # an OWNER, MEMBER or COLLABORATOR, and the workflow that runs is `main`'s.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

# WHY: Claude reads text that outsiders wrote (an issue, a fork's pull request and its code), so a reply can
# carry a prompt injection. Whatever token sits in the job is what an injection could make Claude echo.
# QUIRK(claude-code-action): the action writes its token into .git/config's origin URL in every mode, and
# passes `--permission-mode acceptEdits` ahead of claude_args. So each lock below is a deny list, and the
# action is pinned to a commit: a tool added upstream arrives here as a reviewed diff.
env:
  CLAUDE_READ_TOOLS: >-
    --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*)"
  # The tokens stay unread: no file tool reaches .git/ or the credentials file actions/checkout v6+ keeps
  # in RUNNER_TEMP, and no git form that writes a file (--output) or reads one outside the history is allowed.
  # `git diff` and `git blame` are out entirely: `git diff /dev/null <file>` and `blame -S <file>` read any file.
  CLAUDE_GIT_LOCK: >-
    --disallowedTools "Read(.git/**),Edit(.git/**),Write(.git/**),Read(//home/runner/work/_temp/git-credentials-*),Bash(git diff:*),Bash(git blame:*),Bash(*--output*),Bash(*--no-index*),Bash(*--contents*)"
  CLAUDE_READ_ONLY_LOCK: >-
    --permission-mode default
    --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git push:*),Bash(*git-push.sh*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
  # QUIRK(claude-code): CLAUDE_CODE_SUBPROCESS_ENV_SCRUB turns the action's acceptEdits back into default mode,
  # where a file edit runs only under an allow rule. An Edit rule covers Write too; `./**` stops at the workspace.
  CLAUDE_EDIT_TOOLS: >-
    --allowedTools "Edit(./**)"

jobs:
  # WHY: the repository is public and the jobs below hold CLAUDE_CODE_OAUTH_TOKEN, so nothing starts unless a
  # maintainer asked; anyone else's `@claude` starts nothing. An issue comment runs in this repository's context,
  # with its secrets, even when it sits on a fork's pull request. `read` and `edit` need this job.
  mode:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # `@claude …` is read-only: read code, run read-only git/gh, comment.
      # `@claude edit …` may also edit, commit and push.
      - name: Choose mode
        id: mode
        env:
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          mode="read"
          opt_in='(^|[[:space:]])@claude[[:space:]]+edit([^[:alnum:]_-]|$)'
          if [[ "$BODY" =~ $opt_in ]]; then
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) mode="edit" ;;
              *) echo "::notice::@claude edit needs OWNER, MEMBER or COLLABORATOR; running read-only" ;;
            esac
          fi
          echo "Claude mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # WHY: read mode runs on this job's own token, which cannot push and expires with the job, instead of the
  # action's GitHub App token, which can. With no `id-token: write`, the job cannot mint that App token either.
  read:
    needs: mode
    if: needs.mode.outputs.mode == 'read'
    environment: claude
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # WHY: the action sets its own git credentials (the QUIRK above), so the checkout's token has no use here.
          persist-credentials: false

      # QUIRK(claude-code): under CLAUDE_CODE_SUBPROCESS_ENV_SCRUB a Bash command runs in bubblewrap or not at all,
      # and that sandbox needs socat beside bubblewrap and a user namespace, which Ubuntu's AppArmor can refuse.
      - name: Install the subprocess sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            ${{ env.CLAUDE_READ_TOOLS }}
            ${{ env.CLAUDE_GIT_LOCK }}
            ${{ env.CLAUDE_READ_ONLY_LOCK }}

  # WHY: edit mode pushes, so it takes the action's GitHub App token (minted through `id-token: write`), and
  # only a maintainer's `@claude edit` reaches it.
  edit:
    needs: mode
    if: needs.mode.outputs.mode == 'edit'
    environment: claude
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # WHY: the action sets its own git credentials (the QUIRK above), so the checkout's token has no use here.
          persist-credentials: false

      - name: Install the subprocess sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run Claude Code
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            ${{ env.CLAUDE_READ_TOOLS }}
            ${{ env.CLAUDE_GIT_LOCK }}
            ${{ env.CLAUDE_EDIT_TOOLS }}
